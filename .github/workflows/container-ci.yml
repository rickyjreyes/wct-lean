name: Lean container CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source inventory against the checkout
        run: python3 scripts/audit_formal_sources.py
      - name: Build pinned Lean image
        run: docker build --tag wct-lean-ci .
      - name: Re-run maintained Lean build in the image
        run: docker run --rm wct-lean-ci
