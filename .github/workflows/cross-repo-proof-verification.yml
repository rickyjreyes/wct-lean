name: External research Lean kernel verification (temporary)
on:
  pull_request:
    paths:
      - ".github/workflows/cross-repo-proof-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: eigen
            sha: c86d59ce25866dba552958c390a859f9e22ec767
            audit: Audit.lean
            module: EigenProofs
          - repository: mass
            sha: d7b803a854502453260c7d3a60d19818adc8d807
            audit: AuditCurrent.lean
            module: ReleaseProofs
    steps:
      - name: Checkout frozen source SHA
        uses: actions/checkout@v4
        with:
          repository: rickyjreyes/${{ matrix.repository }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - name: Install pinned elan toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve cached pinned Mathlib
        working-directory: source/lean
        run: |
          lake update
          lake exe cache get
      - name: Check proof placeholders
        working-directory: source/lean
        run: |
          if grep -REn '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' ${{ matrix.module }}/; then
            exit 1
          fi
      - name: Build complete Lean library
        working-directory: source/lean
        run: lake build ${{ matrix.module }}
      - name: Kernel axiom audit
        working-directory: source/lean
        run: |
          set -o pipefail
          lake env lean ${{ matrix.audit }} | tee /tmp/lean-proof-axioms.log
          python3 - <<'PY'
          import re
          s = open('/tmp/lean-proof-axioms.log').read()
          blocks = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', s, re.S)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          bad = {a.strip() for b in blocks for a in b.split(',') if a.strip() not in allowed}
          assert (blocks or 'does not depend on any axioms' in s) and not bad and 'sorryAx' not in s, bad
          print(f'{len(blocks)} checked axiom inventories; allowed standard axioms only')
          PY
