name: Lean formal reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install elan and the repository-pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Fetch locked dependencies and Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Audit source closure and emit SHA-256 manifest
        run: python scripts/audit_formal_sources.py
      - name: Build all maintained Lean targets
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee lean-build.log
      - name: Audit D4 theorem dependencies
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/d4_axiom_audit.lean 2>&1 | tee d4-axioms.log
      - name: Audit S004 corrected action and continuum proof axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/s004_axiom_audit.lean 2>&1 | tee s004-axioms.log
          python scripts/check_s004_axioms.py s004-axioms.log
      - name: Audit corrected complex-curvature limit theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/complex_curvature_limit_axiom_audit.lean 2>&1 | tee curvature-limit-axioms.log
      - name: Audit corrected M6B nonuniqueness theorem axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/complex_closure_nonuniqueness_axiom_audit.lean 2>&1 | tee m6b-closure-axioms.log
      - name: Audit Fourier orthogonality, spectral projection and E78 theorem axioms (#23)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/fourier_e78_axiom_audit.lean 2>&1 | tee fourier-e78-axioms.log
          python scripts/check_axiom_log.py fourier-e78-axioms.log 44 "Fourier/E78"
      - name: Audit nodal curvature-energy theorem axioms (#22)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/curvature_nodal_energy_axiom_audit.lean 2>&1 | tee curvature-nodal-energy-axioms.log
          python scripts/check_axiom_log.py curvature-nodal-energy-axioms.log 12 "nodal-energy"
      - name: Audit curvature-closure classification theorem axioms (#26)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/closure_classification_axiom_audit.lean 2>&1 | tee closure-classification-axioms.log
          python scripts/check_axiom_log.py closure-classification-axioms.log 17 "closure-classification"
      - name: Audit curve-integral locking and winding theorem axioms (#24)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/curve_locking_axiom_audit.lean 2>&1 | tee curve-locking-axioms.log
          python scripts/check_axiom_log.py curve-locking-axioms.log 15 "curve-locking"
      - name: Audit linear M7 semigroup theorem axioms (#19/#21)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/m7_linear_semigroup_axiom_audit.lean 2>&1 | tee m7-linear-axioms.log
          python scripts/check_axiom_log.py m7-linear-axioms.log 18 "m7-linear-semigroup"
      - name: Audit nodal L1-divergence and weak-limit theorem axioms (#22)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/curvature_nodal_weak_limit_axiom_audit.lean 2>&1 | tee nodal-weak-limit-axioms.log
          python scripts/check_axiom_log.py nodal-weak-limit-axioms.log 10 "nodal-weak-limit"
      - name: Audit continuum-obligation theorem axioms (#28)
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/continuum_obligations_axiom_audit.lean 2>&1 | tee continuum-obligations-axioms.log
          python scripts/check_axiom_log.py continuum-obligations-axioms.log 9 "continuum-obligations"
      - name: Confirm the locked dependency graph is unchanged
        run: git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.lean
      - name: Upload Lean build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-log-${{ github.sha }}
          if-no-files-found: error
          path: |
            lean-build.log
            d4-axioms.log
            s004-axioms.log
            curvature-limit-axioms.log
            m6b-closure-axioms.log
            fourier-e78-axioms.log
            curvature-nodal-energy-axioms.log
            closure-classification-axioms.log
            curve-locking-axioms.log
            m7-linear-axioms.log
            nodal-weak-limit-axioms.log
            continuum-obligations-axioms.log
      - name: Upload formal-source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-source-hashes-${{ github.sha }}
          if-no-files-found: error
          path: formal-source-hashes.json
