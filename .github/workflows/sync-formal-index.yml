name: Sync formal coverage index

on:
  push:
    branches:
      - agent/sync-public-80-readme

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-public-80-readme
      - name: Update inherited symbolic partition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('FORMAL_COVERAGE_INDEX.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('| `PASS` | 59 |', '| `PASS` | 68 |')
          text = text.replace('| `CONDITIONAL` | 27 |', '| `CONDITIONAL` | 18 |')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit formal index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FORMAL_COVERAGE_INDEX.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize formal index with 68 PASS registry'
          git push origin HEAD:agent/sync-public-80-readme
