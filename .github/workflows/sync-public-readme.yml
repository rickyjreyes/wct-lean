# One-shot synchronization workflow for the merged 80-ID public README.
name: Sync public Lean README

on:
  push:
    branches:
      - agent/sync-public-80-readme

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-public-80-readme
      - name: Update README coverage summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('59 PASS\n27 CONDITIONAL\n26 DEFINITION\n30 OPEN', '68 PASS\n18 CONDITIONAL\n26 DEFINITION\n30 OPEN')
          text = text.replace('The maintained library now has non-registry equation-specific support for **62 of 142 IDs**:', 'The maintained library now has non-registry equation-specific support for **80 of 142 IDs**:')
          old_ids = '''M1 M2 M3 M4 M5 M6A M6B M7
          E1A E1B E2 E3 E4 E5 E6 E7 E8 E9 E10 E11
          E12 E13 E14 E17 E18 E20
          E24 E25 E26 E27 E28 E29 E33 E36
          E45 E47 E49 E51 E53
          E57 E58 E59 E61 E62 E64
          E65 E66 E67 E68 E69 E70
          E78 E81
          G1 EX EY EZ FA
          CM9 CM12 CM13 CM16'''
          new_ids = '''M1 M2 M3 M4 M5 M6A M6B M7
          E1A E1B E2 E3 E4 E5 E6 E7 E8 E9 E10 E11
          E12 E13 E14 E16 E17 E18 E19 E20 E22
          E24 E25 E26 E27 E28 E29 E32 E33 E36 E37 E38 E41
          E45 E47 E49 E50 E51 E53
          E57 E58 E59 E61 E62 E64
          E65 E66 E67 E68 E69 E70 E72
          E78 E81
          CLE4 CLE5 CLE8 CLE9 CLE10
          G1 EX EY EZ FA
          CM9 CM11 CM12 CM13 CM16
          TOP3 TOP7 CORR2'''
          text = text.replace(old_ids, new_ids)
          text = text.replace('The remaining **80 IDs** are registry-only.', 'The remaining **62 IDs** are registry-only.')
          marker = 'See [`FORMAL_COVERAGE_INDEX.md`](FORMAL_COVERAGE_INDEX.md) for the complete partition and [`THEOREMS.md`](THEOREMS.md) for the declaration-level inventory.\n'
          addition = '''\nThe latest merged expansion adds 18 IDs beyond the original 62-ID baseline, including exact or conditional support for `E16`, `E19`, `E22`, `E32`, `E37`, `E38`, `E41`, `E50`, `E72`, `CLE4`, `CLE5`, `CLE8`, `CLE9`, `CLE10`, `CM11`, `TOP3`, `TOP7`, and `CORR2`. Several of these are constraints or diagnostics rather than full physical closure.\n'''
          if 'The latest merged expansion adds 18 IDs' not in text:
              text = text.replace(marker, marker + addition)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize public Lean coverage at 80 IDs'
          git push origin HEAD:agent/sync-public-80-readme
